[project]
name = "data_transformations"
version = "0.2.0"
description = "data transformations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{ name = "ThoughtWorks", email = "info@thoughtworks.com" }]

# Deps must be array of PEP 508 strings
dependencies = [
  "pandas>=2.0,<3.0",
  "pyarrow>=12,<13",
  "pyspark==3.5.1"
]

# Dev deps in poetry's group
[tool.poetry.group.dev.dependencies]
pytest = "^6.2.5"
pylint = "^2.17.7"
mypy = ">=1.8,<2.0"
ipykernel = "^6.29"
notebook = "^7.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"